name: Owner MiniMax trial safety
on:
  pull_request:
    paths:
      - bot.py
      - fal_provider.py
      - fal_pricing.py
      - berry_credit_pricing.py
      - minimax_retail_guard.py
      - tests/test_minimax_retail_guard.py
      - berry_admin_minimax_trial.py
      - tests/test_admin_minimax_trial.py
      - .github/workflows/admin-minimax-trial.yml
  workflow_dispatch:
jobs:
  offline-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx==0.25.2'
      - run: python -m py_compile bot.py fal_provider.py berry_admin_minimax_trial.py
      - run: python -m unittest discover -s tests -p 'test_admin_minimax_trial.py' -v
      - run: python -m unittest discover -s tests -p 'test_fal_provider.py' -v
      - run: python -m unittest discover -s tests -p 'test_minimax_contract.py' -v
      - run: python -m unittest discover -s tests -p 'test_minimax_retail_guard.py' -v
