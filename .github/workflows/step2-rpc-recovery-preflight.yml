name: STEP 2 RPC recovery preflight
on:
  pull_request:
    paths:
      - 'step2_mock_supabase_rpc_adapter.py'
      - 'tests/test_step2_rpc_recovery_preflight.py'
      - '.github/workflows/step2-rpc-recovery-preflight.yml'
  workflow_dispatch:
jobs:
  recovery-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run mock RPC recovery preflight regressions
        run: python -m unittest discover -s tests -p test_step2_rpc_recovery_preflight.py -v
