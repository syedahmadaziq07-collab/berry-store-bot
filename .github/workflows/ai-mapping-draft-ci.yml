name: AI Mapping Staging Draft Integration Tests
on:
  push:
    branches:
      - feat/gemini-control-center-integration-20261111
      - feat/berry-ai-model-mapping-20261111
    paths:
      - admin_app.py
      - ai_model_mapping.py
      - ai_model_mapping_store.py
      - tests/test_ai_model_mapping_private.py
      - docs/sql/berry_private_ai_model_mappings.sql
      - frontend/**
      - Dockerfile.admin
      - tests/test_ai_model_mapping_draft.py
      - .github/workflows/ai-mapping-draft-ci.yml
  pull_request:
    paths:
      - admin_app.py
      - ai_model_mapping.py
      - ai_model_mapping_store.py
      - tests/test_ai_model_mapping_private.py
      - docs/sql/berry_private_ai_model_mappings.sql
      - frontend/**
      - Dockerfile.admin
      - tests/test_ai_model_mapping_draft.py
      - .github/workflows/ai-mapping-draft-ci.yml
  workflow_dispatch:
jobs:
  backend-draft-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-admin.txt
      - run: python -m py_compile admin_app.py ai_model_mapping.py ai_model_mapping_store.py
      - run: python -m unittest discover -s tests -p 'test_ai_model_mapping_draft.py' -v
      - run: python -m unittest discover -s tests -p 'test_ai_model_mapping.py' -v
      - run: python -m unittest discover -s tests -p 'test_ai_model_mapping_private.py' -v
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
