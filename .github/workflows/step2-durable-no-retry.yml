name: STEP 2 durable no retry
on:
  pull_request:
    paths:
      - 'step2_no_retry_protocol.py'
      - 'tests/test_step2_no_retry_protocol.py'
      - '.github/workflows/step2-durable-no-retry.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no-retry state machine
        run: python -m unittest discover -s tests -p test_step2_no_retry_protocol.py -v
