name: AI Model Mapping CI
on:
  pull_request:
    paths:
      - ai_model_mapping.py
      - admin_app.py
      - bot.py
      - frontend/**
      - tests/test_ai_model_mapping.py
      - .github/workflows/ai-model-mapping-ci.yml
  workflow_dispatch:
jobs:
  mapping-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m py_compile ai_model_mapping.py admin_app.py bot.py
      - name: Model mapping unit tests
        run: python -m unittest discover -s tests -p 'test_ai_model_mapping.py' -v
  mapping-react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
