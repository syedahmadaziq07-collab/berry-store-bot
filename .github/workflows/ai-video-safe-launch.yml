name: Berry AI Video Safe Launch Checks
on:
  pull_request:
    paths:
      - ai_video_pipeline.py
      - ai_model_mapping.py
      - bot.py
      - tests/test_ai_video_pipeline.py
      - tests/test_ai_model_mapping.py
      - .github/workflows/ai-video-safe-launch.yml
  workflow_dispatch:
jobs:
  safe-video-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.25.2
      - run: python -m py_compile ai_video_pipeline.py ai_model_mapping.py bot.py
      - run: python -m unittest discover -s tests -p 'test_ai_video_pipeline.py' -v
      - run: python -m unittest discover -s tests -p 'test_ai_model_mapping.py' -v
