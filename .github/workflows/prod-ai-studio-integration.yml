name: prod ai studio integration
on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'telegram_image_flow.py'
      - 'telegram_image_delivery.py'
      - 'telegram_image_offer_builder.py'
      - 'staging_job_worker.py'
      - 'video_myr_worker.py'
      - 'fal_provider.py'
      - 'tests/test_prod_ai_studio_integration.py'
      - 'tests/test_telegram_image_flow.py'
      - 'tests/test_telegram_image_delivery.py'
      - '.github/workflows/prod-ai-studio-integration.yml'
  pull_request:
    paths:
      - 'bot.py'
      - 'telegram_image_flow.py'
      - 'telegram_image_delivery.py'
      - 'telegram_image_offer_builder.py'
      - 'staging_job_worker.py'
      - 'video_myr_worker.py'
      - 'fal_provider.py'
      - 'tests/test_prod_ai_studio_integration.py'
      - 'tests/test_telegram_image_flow.py'
      - 'tests/test_telegram_image_delivery.py'
      - '.github/workflows/prod-ai-studio-integration.yml'
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx==0.25.2' 'python-telegram-bot==20.7'
      - run: python -m py_compile bot.py telegram_image_flow.py telegram_image_delivery.py telegram_image_offer_builder.py staging_job_worker.py video_myr_worker.py fal_provider.py
      - name: Startup safety, feature flags and wallet display
        run: python -m unittest discover -s tests -p test_prod_ai_studio_integration.py -v
      - name: Image consent and delivery modules
        run: |
          python -m unittest discover -s tests -p test_telegram_image_flow.py -v
          python -m unittest discover -s tests -p test_telegram_image_delivery.py -v