name: step3 image consent and delivery
on:
  push:
    branches: [main]
    paths:
      - 'telegram_image_flow.py'
      - 'telegram_image_delivery.py'
      - 'tests/test_telegram_image_flow.py'
      - 'tests/test_telegram_image_delivery.py'
      - '.github/workflows/step3-image-consent.yml'
  pull_request:
    paths:
      - 'telegram_image_flow.py'
      - 'telegram_image_delivery.py'
      - 'tests/test_telegram_image_flow.py'
      - 'tests/test_telegram_image_delivery.py'
      - '.github/workflows/step3-image-consent.yml'
  workflow_dispatch:
jobs:
  budget-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: step2_test
          POSTGRES_PASSWORD: step2_test
          POSTGRES_DB: step2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step2_test -d step2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.1,<4' 'httpx==0.25.2'
      - name: Budget guard policy and RM5 ledger SQL
        env:
          BERRY_STEP3_LOCAL_POSTGRES: '1'
        run: |
          python -m unittest discover -s tests -p test_image_budget_guard.py -v
          python -m unittest discover -s tests -p test_budget_ledger_postgres.py -v
  image-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx==0.25.2'
      - run: python -m py_compile telegram_image_flow.py telegram_image_delivery.py telegram_image_offer_builder.py
      - name: Verify image consent flow and sendPhoto delivery
        run: |
          python -m unittest discover -s tests -p test_telegram_image_flow.py -v
          python -m unittest discover -s tests -p test_telegram_image_delivery.py -v
  image-consent-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: step2_test
          POSTGRES_PASSWORD: step2_test
          POSTGRES_DB: step2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U step2_test -d step2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run isolated PostgreSQL image consent fixtures
        env:
          BERRY_STEP3_LOCAL_POSTGRES: '1'
        run: python -m unittest discover -s tests -p test_step3_image_consent_postgres.py -v