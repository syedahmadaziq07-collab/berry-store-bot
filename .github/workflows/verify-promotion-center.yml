name: Verify Promotion Center
on:
  push:
    branches: [main]
    paths:
      - "promotion_center.py"
      - "tests/test_promotion_center.py"
      - "docs/sql/berry_promotion_center.sql"
      - ".github/workflows/verify-promotion-center.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile promotion_center.py
      - name: Unit tests (no provider calls)
        run: python -m unittest tests.test_promotion_center -v
