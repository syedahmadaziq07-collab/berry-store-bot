name: step3 production quotation
on:
  push:
    branches: [main]
    paths:
      - 'ai_product_catalog.py'
      - 'ai_pricing_engine.py'
      - 'ai_quotation_service.py'
      - 'telegram_quote_flow.py'
      - 'step3_minimax_offer.py'
      - 'tests/test_step3_quotation.py'
      - 'tests/test_step3_minimax_offer.py'
      - '.github/workflows/step3-quotation.yml'
  pull_request:
    paths:
      - 'ai_product_catalog.py'
      - 'ai_pricing_engine.py'
      - 'ai_quotation_service.py'
      - 'telegram_quote_flow.py'
      - 'step3_minimax_offer.py'
      - 'tests/test_step3_quotation.py'
      - 'tests/test_step3_minimax_offer.py'
      - '.github/workflows/step3-quotation.yml'
  workflow_dispatch:
jobs:
  quotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx==0.25.2'
      - run: python -m py_compile bot.py ai_product_catalog.py ai_pricing_engine.py ai_quotation_service.py telegram_quote_flow.py step3_minimax_offer.py
      - name: STEP 3 catalog, pricing engine, quotation and offer builder
        run: |
          python -m unittest discover -s tests -p test_step3_quotation.py -v
          python -m unittest discover -s tests -p test_step3_minimax_offer.py -v
          python -m unittest discover -s tests -p test_minimax_retail_guard.py -v
      - name: Durable quotation store
        run: python -m py_compile ai_quote_store.py ai_quotation_service.py bot.py
      - name: Production regression guards
        run: python -m unittest discover -s tests -p test_prod_ai_studio_integration.py -v