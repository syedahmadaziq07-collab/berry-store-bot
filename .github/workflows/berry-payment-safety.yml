name: Berry payment safety checks
on:
  pull_request:
    paths:
      - bot.py
      - dashboard.html
      - docs/sql/berry_approve_topup_order.sql
      - docs/sql/berry_orders_access_lockdown.sql
      - tests/test_berry_payment_release_gates.py
      - tests/test_berry_topup_contract.py
      - tests/test_berry_dashboard_orders_proxy.py
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bot without importing or running it
        run: python -m py_compile bot.py
      - name: Payment safety tests
        run: python -m unittest discover -s tests -p 'test_berry_*py' -v
