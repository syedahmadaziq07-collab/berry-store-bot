name: prod step2 completion
on:
  push:
    branches: [main]
    paths:
      - 'step2_*.py'
      - 'fal_pricing.py'
      - 'tests/test_fal_pricing.py'
      - 'video_reconciliation.py'
      - 'ai_wallet_pricing_adapter.py'
      - 'tests/test_step2_*.py'
      - '.github/workflows/prod-step2-completion.yml'
  pull_request:
    paths:
      - 'step2_*.py'
      - 'fal_pricing.py'
      - 'tests/test_fal_pricing.py'
      - 'video_reconciliation.py'
      - 'ai_wallet_pricing_adapter.py'
      - 'tests/test_step2_*.py'
      - '.github/workflows/prod-step2-completion.yml'
  workflow_dispatch:
jobs:
  step2-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx==0.25.2'
      - run: python -m py_compile step2_no_retry_protocol.py step2_submission_gate.py step2_operator_reconciliation.py step2_staging_preflight.py video_reconciliation.py ai_wallet_pricing_adapter.py
      - name: STEP 2 durable safety suites
        run: python -m unittest discover -s tests -p 'test_step2*.py' -v
      - name: Verified pricing and production model catalog
        run: |
          python -m unittest discover -s tests -p test_fal_pricing.py -v
          python -m unittest discover -s tests -p test_production_model_catalog.py -v
      - name: STEP 2 video flow, delivery, worker and reconciliation
        run: |
          python -m pip install 'python-telegram-bot==20.7'
          python -m py_compile telegram_video_flow.py telegram_video_delivery.py telegram_video_handlers.py video_myr_worker.py provider_readiness.py step2_pricing_probe.py
          python -m unittest discover -s tests -p 'test_telegram_video*.py' -v
          python -m unittest discover -s tests -p test_video_myr_worker.py -v
          python -m unittest discover -s tests -p test_video_reconciliation.py -v
          python -m unittest discover -s tests -p test_step2_provider_safety_mocks.py -v
          python -m unittest discover -s tests -p test_step2_pricing_probe.py -v